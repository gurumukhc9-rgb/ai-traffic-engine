name: AI Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install --upgrade google-genai requests

      - name: Run Publisher Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/auto_publisher.py

      - name: Commit and Push Generated Post
        run: |
          git config --global user.name "AI Publisher Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add posts/
          git commit -m "Auto-generated new blog post" || echo "No changes to commit"
          git push
          
