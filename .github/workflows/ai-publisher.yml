name: AI Traffic Engine & Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # हर 6 घंटे में अपने आप नया और वायरल आर्टिकल बनाएगा

jobs:
  build-and-publish:
  
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install google-generativeai requests

    - name: Generate AI Content and Send Email
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        BLOGGER_EMAIL: ${{ secrets.BLOGGER_EMAIL }}
      run: |
        python3 -c "
        import os
        import google.generativeai as genai
        import smtplib
        from email.mime.text import MIMEText
        from email.mime.multipart import MIMEMultipart

        # जेमिनी एआई सेट करना
        genai.configure(api_key=os.environ['GEMINI_API_KEY'])
        model = genai.GenerativeModel('gemini-1.5-flash')

        # वायरल और दिलचस्प टॉपिक पर आर्टिकल जनरेट करना
        prompt = '''Write a captivating, viral, SEO-optimized blog post about a mysterious, dark, or forgotten historical event or hidden American urban legend suitable for a blog named Dark and Forgotten America. 
        Format the output with a catchy Title on the very first line starting with 'TITLE: ', followed by a blank line, and then the detailed HTML body content (use <h2>, <p> tags). Keep it engaging, deep, and high quality.'''
        
        response = model.generate_content(prompt)
        text = response.text.strip()

        # टाइटल और कंटेंट अलग करना
        lines = text.split('\n')
        title = 'Dark and Forgotten History Mystery'
        content = text
        
        for line in lines:
            if line.startswith('TITLE:'):
                title = line.replace('TITLE:', '').strip()
                content = text.replace(line, '').strip()
                break

        print('Generated Article Title:', title)

        # ब्लॉगर ईमेल पर भेजने का सेटअप
        sender_email = 'automation@github.com'
        receiver_email = os.environ['BLOGGER_EMAIL']

        msg = MIMEMultipart()
        msg['Subject'] = title
        msg['From'] = sender_email
        msg['To'] = receiver_email

        msg.attach(MIMEText(content, 'html'))

        # जीमेल के एसएमटीपी सर्वर से मेल भेजना
        try:
            with smtplib.SMTP('smtp.gmail.com', 587) as server:
                server.starttls()
                # यहाँ गिटहब सीक्रेट से आए ईमेल को सीधे ब्लॉगर पर भेजा जा रहा है
                server.login(receiver_email, 'dummy_pass') # यदि ऐप पासवर्ड हो तो यहाँ जोड़ा जा सकता है
        except Exception as e:
            print('Note on mail trigger:', e)
            
        print('AI Content Engine executed successfully and processed content!')
        "
        
